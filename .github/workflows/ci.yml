name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2"
          python -m pip install ".[test,ml]"
      - name: Run tests
        run: pytest

  comic-editor-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ocxkcd
        uses: actions/checkout@v6
        with:
          path: ocxkcd
      - name: Checkout comic_editor
        uses: actions/checkout@v6
        with:
          repository: whatifrussian/comic_editor
          path: comic_editor
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ocxkcd/pyproject.toml
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: comic_editor/package-lock.json
      - name: Install ocxkcd test dependencies
        working-directory: ocxkcd
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2"
          python -m pip install ".[test,ml]"
      - name: Install comic_editor dependencies
        working-directory: comic_editor
        run: npm ci
      - name: Run comic_editor CLI integration
        working-directory: ocxkcd
        env:
          COMIC_EDITOR_DIR: ${{ github.workspace }}/comic_editor
        run: pytest -m integration
